name: budget_manager
description: "Personal budget management app - track income, expenses, and savings."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # UI & Styling
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  http: ^1.2.0
  sqflite_common_ffi: ^2.3.2
  sqflite_common_ffi_web: ^0.4.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
