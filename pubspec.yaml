name: moviemax_flutter
description: "A modern cross-platform movie & media mobile app built with Flutter, consuming TMDB, Firebase, Cloudinary & Neon PostgreSQL."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Environment & Utilities
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  archive: ^3.6.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # UI & Styling
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  
  # Media & Icons
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
